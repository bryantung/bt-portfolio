<section class="section-container">
    <h2 class="section-title">Work Experience</h2>

    <!-- TIMELINE LAYOUT (Default / Light) -->
    <div class="experience-timeline">
        <div class="timeline">
            <!-- EXPERIENCE_TIMELINE -->
        </div>
    </div>

    <!-- PLAYLIST LAYOUT (Winamp Theme) -->
    <div class="experience-playlist">
        <div class="playlist-container">
            <div class="playlist-header">
                <div class="col-play">#</div>
                <div class="col-title">TITLE</div>
                <div class="col-album">ALBUM</div>
                <div class="col-genre">GENRE</div>
                <div class="col-duration"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg></div>
            </div>

            <div class="playlist-tracks">
                <!-- EXPERIENCE_PLAYLIST -->
            </div>
        </div>
    </div>

    <script>
        function toggleTrack(element) {
            const allTracks = document.querySelectorAll('.track-row');
            allTracks.forEach(track => {
                if (track !== element) {
                    track.classList.remove('playing');
                }
            });

            element.classList.toggle('playing');
        }
    </script>
</section>
