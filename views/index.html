    <!-- CSS -->

<body>

                <span></span>
            </button>
            <div class="nav-content">
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html" hx-get="index.html" hx-target="#main-content" hx-select="#main-content"
                                hx-push-url="true" hx-swap="innerHTML transition:true">Home</a></li>
                        <li><a href="experiences.html" hx-get="experiences.html" hx-target="#main-content"
                                hx-select="#main-content" hx-push-url="true"
                                hx-swap="innerHTML transition:true">Experiences</a></li>
                        <li><a href="education.html" hx-get="education.html" hx-target="#main-content"
                                hx-select="#main-content" hx-push-url="true"
                                hx-swap="innerHTML transition:true">Education</a></li>
                        <li><a href="tech-stack.html" hx-get="tech-stack.html" hx-target="#main-content"
                                hx-select="#main-content" hx-push-url="true" hx-swap="innerHTML transition:true">Tech

                        <li><a href="contact.html" hx-get="contact.html" hx-target="#main-content"

                            <option value="light">☀️ Light</option>

                        </select>
                    </div>
                    <a href="https://github.com/bryantung" target="_blank" aria-label="GitHub">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">

        <main id="main-content">
            <!-- CONTENT_PLACEHOLDER -->
        </main>

        <footer class="main-footer">
            <p>&copy; 2026 Bryan Tung</p>
        </footer>
    </div>

    <script>
        // Theme Selector Logic
        const themeSelector = document.getElementById('theme-selector');
        const savedTheme = localStorage.getItem('theme') || 'dark';

        // Set initial theme
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeSelector.value = savedTheme;

        // Handle theme change
        themeSelector.addEventListener('change', (e) => {
            const newTheme = e.target.value;
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Mobile Menu Logic
        const hamburger = document.querySelector('.hamburger');
        const navContent = document.querySelector('.nav-content');

        if (hamburger && navContent) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navContent.classList.toggle('active');
            });

            // Close menu when clicking a link
            document.querySelectorAll('.main-nav a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navContent.classList.remove('active');
                });
            });
        }

        // Active Nav Highlighting
        function updateActiveNav() {
            let currentPath = window.location.pathname;
            // Get just the filename
            let filename = currentPath.split('/').pop() || 'index.html';
            // Handle empty or root path
            if (filename === '' || filename === '/') {
                filename = 'index.html';
            }
            // Add .html extension if missing (server may strip it)
            if (!filename.endsWith('.html')) {
                filename = filename + '.html';
            }

            document.querySelectorAll('.main-nav a').forEach(link => {
                const linkHref = link.getAttribute('href');
                if (linkHref === filename) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // Run on page load
        updateActiveNav();

        // Re-run after HTMX navigation (use pushedIntoHistory for correct URL)
        document.body.addEventListener('htmx:pushedIntoHistory', updateActiveNav);
        // Also listen for afterSwap as fallback
        document.body.addEventListener('htmx:afterSwap', () => {
            setTimeout(updateActiveNav, 50);
        });
    </script>
</body>

</html>
